# Keep the site on the latest PUBLISHED release of every source repository sources.json marks
# "follow": "release" (hatsu and nen). A bare tag never moves a pin: GitHub's releases/latest answers only a
# published release that is neither a draft nor a prerelease, and a pin ahead of the latest release is never
# moved back (scripts/sources/release.mjs).
#
# The repin is PROPOSED, never merged: only the human merges to main (CON-5; the maintainer's ruling
# R-2026-11-05-01 on this workflow picked a repin pull request over a direct push). Two jobs, so the dependency
# tree never shares a job with a write token:
#   prove -- read-only. Reads the releases, repins, skips when the open proposal already carries these pins, and
#            proves the repin (the collector at the new commits, the unit tests, the build lane), then hands the
#            proved sources.json and its compare links on as an artifact.
#   land  -- write. Installs and builds nothing: on a bare checkout of the exact main commit prove started from,
#            scripts/sources/verify-repin.mjs (no dependencies) refuses anything but a pin move, then the commit is
#            pushed to bot/sources-repin and one pull request is opened (or refreshed) against main. quality.yml and
#            nen-shu.yml are dispatched on that branch, because the pull_request runs of a PR the workflow token opened
#            wait for approval; each dispatched lane posts its result as a commit status the PR shows (the lanes'
#            `report` jobs). The maintainer's merge is the deploy (pages.yml
#            runs on the push to main).
# To decline a release, close the PR and keep the branch: the next run finds the same pins already proposed and
# skips. Deleting the branch re-proposes on the next run, and so does a proposal that never finished (no PR, or an
# open PR with no check runs at its head). A red proof or a refused landing proposes nothing and
# fails the run, which GitHub reports to the maintainer.
#
# Repository setting this needs: Settings → Actions → General → "Allow GitHub Actions to create and approve pull
# requests". Without it the PR step fails loudly and nothing reaches main.
#
# Triggers: an hourly poll (no secret needed: the source repositories are public), a manual run, and a
# repository_dispatch of type `source-released`. The dispatch only starts the same poll (no event payload is
# read). A sender in another repository would need a credential with write access to this one, so if one is ever
# wanted, use a GitHub App installation token scoped to this repository alone, never a personal access token. The
# hourly poll needs none.
name: sources refresh

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [source-released]

permissions:
  contents: read

concurrency:
  group: sources-refresh
  cancel-in-progress: false

env:
  PROPOSAL_BRANCH: bot/sources-repin

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read # read the proposal PR's state
      checks: read # read whether the proposal's lanes ran at its head
    env:
      GATSBY_TELEMETRY_DISABLED: '1'
    outputs:
      land: ${{ steps.proposed.outputs.fresh }}
      summary: ${{ steps.check.outputs.summary }}
      base: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - id: check
        name: latest published releases against the pins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sources/refresh.mjs --write --notes "${RUNNER_TEMP}/repin-notes.md"
      - id: proposed
        name: skip a repin already proposed in full
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Matching branch pins alone are not a finished proposal: the branch is pushed before the PR is opened and
        # the lanes dispatched, so a failed land leaves the branch behind. Skip only when the pins match AND the
        # proposal completed -- a CLOSED PR (the maintainer declined it), or an OPEN one whose head carries check
        # runs. Anything less (no PR at all, or an open PR with no runs at its head) lands again.
        run: |
          fresh=true
          if gh api "repos/${GITHUB_REPOSITORY}/contents/sources.json?ref=${PROPOSAL_BRANCH}" --jq .content > "${RUNNER_TEMP}/proposed.b64" 2>/dev/null \
            && base64 -d "${RUNNER_TEMP}/proposed.b64" > "${RUNNER_TEMP}/proposed.json" \
            && node scripts/sources/same-pins.mjs "${RUNNER_TEMP}/proposed.json" sources.json; then
            pr=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${PROPOSAL_BRANCH}" --state all --limit 1 --json state,headRefOid --jq '.[0] // empty | "\(.state) \(.headRefOid)"')
            state=${pr%% *}
            head=${pr#* }
            if [ "${state}" = CLOSED ]; then
              fresh=false
            elif [ "${state}" = OPEN ] && [ "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head}/check-runs" --jq .total_count)" -gt 0 ]; then
              fresh=false
            fi
            echo "proposal: ${pr:-none}; land again: ${fresh}"
          fi
          echo "fresh=${fresh}" >> "$GITHUB_OUTPUT"

      # Everything below runs only for a repin not already proposed.
      - if: steps.proposed.outputs.fresh == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - if: steps.proposed.outputs.fresh == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.proposed.outputs.fresh == 'true'
        name: prove the repin (collector at the new commits, unit tests, build lane)
        run: |
          pnpm sources:fetch
          pnpm test
          pnpm test:build
      - if: steps.proposed.outputs.fresh == 'true'
        run: cp "${RUNNER_TEMP}/repin-notes.md" repin-notes.md
      - if: steps.proposed.outputs.fresh == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proved-sources
          path: |
            sources.json
            repin-notes.md
          retention-days: 1
          if-no-files-found: error

  land:
    needs: prove
    if: needs.prove.outputs.land == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # push the proposal branch (never main)
      pull-requests: write # open or refresh the one proposal PR
      actions: write # dispatch quality.yml and nen-shu.yml on the proposal branch
    steps:
      # The exact commit prove read. Credentials persist for this job's push only; nothing here installs or
      # runs a dependency.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prove.outputs.base }}
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: proved-sources
          path: ${{ runner.temp }}/proved
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: refuse anything but a pin move
        run: |
          node scripts/sources/verify-repin.mjs sources.json "${RUNNER_TEMP}/proved/sources.json"
          cp "${RUNNER_TEMP}/proved/sources.json" sources.json
      - name: commit the repin to the proposal branch
        env:
          SUMMARY: ${{ needs.prove.outputs.summary }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sources.json
          git commit -m "chore(sources): ${SUMMARY}" -m "Published release(s) read by .github/workflows/sources-refresh.yml; collector, unit tests and build lane green at the new pins in its read-only prove job."
          # The bot's own branch, rewritten to one proved commit on main each time; main is never pushed.
          git push --force origin "HEAD:refs/heads/${PROPOSAL_BRANCH}"
      - name: open or refresh the proposal pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ needs.prove.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Release repin proposed by \`.github/workflows/sources-refresh.yml\` ([run](${RUN_URL}))."
            echo
            cat "${RUNNER_TEMP}/proved/repin-notes.md"
            echo
            echo "Proved in the read-only prove job: the collector at the new commits, the unit tests and the build lane. \`scripts/sources/verify-repin.mjs\` confirmed only release pins moved. The quality and \`nen shu\` lanes are dispatched on this branch and report as the \`quality\` and \`nen shu\` commit statuses on this PR; the \`pull_request\` runs GitHub holds for approval are not needed."
            echo
            echo "**Merging deploys the site** (\`pages.yml\` runs on the push to \`main\`). To decline this release, close the PR and keep the branch; the next run sees the same pins already proposed and skips."
          } > "${RUNNER_TEMP}/pr-body.md"
          title="chore(sources): ${SUMMARY}"
          number=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${PROPOSAL_BRANCH}" --state open --json number --jq '.[0].number // empty')
          if [ -n "${number}" ]; then
            gh pr edit "${number}" --repo "${GITHUB_REPOSITORY}" --title "${title}" --body-file "${RUNNER_TEMP}/pr-body.md"
          else
            gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "${PROPOSAL_BRANCH}" --title "${title}" --body-file "${RUNNER_TEMP}/pr-body.md"
          fi
      - name: run the CI lanes on the proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run quality.yml --repo "${GITHUB_REPOSITORY}" --ref "${PROPOSAL_BRANCH}"
          gh workflow run nen-shu.yml --repo "${GITHUB_REPOSITORY}" --ref "${PROPOSAL_BRANCH}"
