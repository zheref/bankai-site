# .github/workflows/nen-shu.yml -- written by `nen scaffold`.
#
# Every step below is `nen shu <verb>`, and every argv those verbs run comes
# from THIS repository's own nen/contract.json. Nothing in this file names a
# build tool, a package manager or a test runner, and nothing in it should:
# to change what CI runs, change the declaration.
name: nen shu

on:
  pull_request:
  push:
    branches: [main]
  # .github/workflows/sources-refresh.yml dispatches this lane on its bot/sources-repin branch: the pull_request run
  # of the repin PR it opens with the workflow token waits for approval, and its empty check suite hides any other
  # run of this workflow on the PR. A dispatched run therefore reports its result as a commit status (the `report`
  # job), which the PR always shows.
  workflow_dispatch:

# READ-ONLY BY DECLARATION. This workflow fetches a pinned nen release over
# plain HTTPS and runs `nen shu` verbs against the checkout; it pushes nothing,
# comments on nothing and opens nothing (a dispatched run's one commit status is
# the `report` job's, with its own token). Saying so here means a step that later
# grew a write fails loudly instead of inheriting whatever this repository's
# default token permission happens to be.
permissions:
  contents: read

jobs:
  shu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # The lane's declared preconditions (nen/contract.json → project.preconditions.gatsby): installed dependencies.
      # The sources the build reads are fetched by the build itself (scripts/sources/collect.mjs fetches a missing checkout at its pin).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Pinned by ref. Re-pinning this repository is this one value; the
      # bootstrap verifies the binary it fetches against the release manifest.
      - name: nen
        env:
          NEN_REF: v0.28.0
        run: |
          curl -fsSL "https://raw.githubusercontent.com/zheref/nen/${NEN_REF}/bootstrap/nen.sh" -o nen-bootstrap.sh
          echo "NEN=$(bash nen-bootstrap.sh --ref "${NEN_REF}")" >> "${GITHUB_ENV}"

      # Read-only: reports what this runner has against what the declaration
      # pins, and installs nothing. Exit 5 is "a pinned tool is missing" and
      # fails the job. Exit 7 is "nen is behind dependency.pinned_ref": the
      # NEN_REF above is older than the ref nen/contract.json pins -- drift in
      # this file, not a broken runner -- so it is a warning and the job goes
      # on. Every other non-zero code still fails.
      - name: toolchain
        run: |
          set +e
          "${NEN}" shu tools --repo .
          status=$?
          if [ "${status}" -eq 7 ]; then
            echo "::warning title=nen behind pinned_ref::NEN_REF in this workflow is older than dependency.pinned_ref in nen/contract.json -- repin this file's NEN_REF."
            exit 0
          fi
          exit "${status}"

      # --dry-run FIRST on every verb. It prints the argv the declaration
      # states and spawns nothing, so a declaration that drifted fails here
      # rather than half-way through a real build.
      - name: build / test / lint
        run: |
          set +e
          for verb in build test lint; do
            # The empty second form is deliberately unquoted: it must vanish.
            for form in "--dry-run" ""; do
              "${NEN}" shu "${verb}" --repo . ${form}
              status=$?
              [ "${status}" -eq 0 ] && continue
              # 4 is "this lane declares no such verb" -- a fact about the
              # repository, not a failure of the run.
              [ "${status}" -eq 4 ] && { echo "shu ${verb}: not declared for this lane"; break; }
              exit "${status}"
            done
          done

  # A dispatched run only: the lane's result as the `nen shu` commit status on the commit it tested, linked to this
  # run. The one write in this workflow, a status, in its own job so the lane above keeps a read-only token.
  report:
    needs: shu
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      statuses: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.shu.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "${RESULT}" in success) state=success ;; cancelled) state=error ;; *) state=failure ;; esac
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="${state}" -f context="nen shu" -f target_url="${RUN_URL}" \
            -f description="nen shu lane (dispatched): ${RESULT}" --silent
